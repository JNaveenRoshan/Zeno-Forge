<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Zeno Plant Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDE7DC; --glass:rgba(255,255,255,.78); --glass-solid:#ffffff; --border:rgba(255,255,255,.85);
  --ink:#1b1f27; --ink2:#5b6270; --ink3:#8a909c; --line:rgba(20,24,32,.08); --chip:rgba(20,24,32,.05);
  --accent:#2F6BFF; --accent-soft:rgba(47,107,255,.12);
  --ev:#0FA97A; --ev-soft:rgba(15,169,122,.13); --ice:#E8812A; --ice-soft:rgba(232,129,42,.14);
  --ok:#16a34a; --ok-soft:rgba(22,163,74,.12); --warn:#d97706; --warn-soft:rgba(217,119,6,.13); --bad:#e5484d; --bad-soft:rgba(229,72,77,.12);
  --shadow:0 8px 30px rgba(30,30,40,.10), 0 1px 2px rgba(30,30,40,.06);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
body.night{
  --glass:rgba(17,21,30,.8); --glass-solid:#151a24; --border:rgba(255,255,255,.08);
  --ink:#eef1f6; --ink2:#a3abb9; --ink3:#6f7787; --line:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
  --accent:#5B8CFF; --accent-soft:rgba(91,140,255,.16); --shadow:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#top{position:fixed;top:12px;left:12px;right:12px;height:56px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:max-content}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.brand b{font-size:16px;display:block;line-height:1.1}.brand span{font-size:11px;color:var(--ink2)}
.search{position:relative;flex:1;max-width:360px;min-width:140px}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--chip);padding:0 34px;font:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);background:var(--glass-solid)}
.search>svg{position:absolute;left:11px;top:10px;color:var(--ink3)}
.search kbd{position:absolute;right:9px;top:9px;font-family:var(--mono);font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
#sres{position:absolute;top:42px;left:0;right:0;padding:6px;display:none;max-height:340px;overflow:auto}
#sres.on{display:block}
.sr{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;cursor:pointer}
.sr:hover,.sr.hi{background:var(--accent-soft)}.sr small{color:var(--ink3);margin-left:auto;font-size:11px}
.tb-sp{flex:1}.dd{position:relative}
.btn{height:36px;display:flex;align-items:center;gap:7px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--chip);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
.menu{position:absolute;top:44px;right:0;min-width:210px;padding:6px;display:none;z-index:30}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover,.menu button.on{background:var(--accent-soft)}.menu button small{margin-left:auto;color:var(--ink3)}
.clock{display:flex;flex-direction:column;line-height:1.15;min-width:max-content}
.clock b{font-family:var(--mono);font-size:15px}.clock span{font-size:10.5px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.live{color:var(--bad);font-weight:700;font-size:9.5px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:4px}
.live:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--chip);border:1px solid var(--line)}
.seg button{padding:5px 9px;border-radius:7px;font-size:12px;color:var(--ink2)}
.seg button.on{background:var(--glass-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bell{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--chip)}
.bell em{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7b8cff,#2F6BFF);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
#alerts{width:330px}.al{display:block!important;padding:9px 10px!important}.al b{display:block;font-size:12.5px}.al span{font-size:11.5px;color:var(--ink2)}
#kpis{position:fixed;top:80px;left:12px;display:flex;gap:10px;z-index:10}
.kpi{width:206px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .h{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:11.5px;font-weight:500}
.kpi .h i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .s{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink2)}
.up{color:var(--ok);font-weight:600}.kpi svg.sp{width:70px;height:22px}
#detail{position:fixed;top:80px;right:12px;width:350px;max-height:calc(100vh - 92px - 250px);overflow:auto;padding:16px;z-index:10}
#detail::-webkit-scrollbar,#tbody::-webkit-scrollbar,#hubGrid::-webkit-scrollbar{width:6px}
#detail::-webkit-scrollbar-thumb,#tbody::-webkit-scrollbar-thumb,#hubGrid::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.dh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.dh .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.dh h3{font-size:15px;letter-spacing:-.2px}.dh p{font-size:11.5px;color:var(--ink2);margin-top:2px}
.dh .x{margin-left:auto;color:var(--ink3);padding:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-acc{background:var(--accent-soft);color:var(--accent)}.p-mut{background:var(--chip);color:var(--ink2)}
.p-ev{background:var(--ev-soft);color:var(--ev)}.p-ice{background:var(--ice-soft);color:var(--ice)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.st{background:var(--chip);border-radius:10px;padding:9px 10px}
.st small{display:block;font-size:10.5px;color:var(--ink2);margin-bottom:3px}
.st b{font-size:15px;font-variant-numeric:tabular-nums}.st b.sm{font-size:12.5px}
h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin:4px 0 8px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv span{color:var(--ink2)}.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer;border-radius:6px}
.pl:hover{background:var(--chip)}.pl .n{font-weight:600}.pl .m{color:var(--ink2);font-size:11px}.pl .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:6px 0 4px}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--ink2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:4px}.legend span i{width:8px;height:8px;border-radius:2px;display:inline-block}
.wf{display:grid;grid-template-columns:110px 1fr 66px;align-items:center;gap:8px;font-size:11.5px;padding:4px 0}
.wf .b{height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}.wf .b i{position:absolute;top:0;bottom:0;border-radius:4px}
.wf b{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-weight:600}
.cta{width:100%;margin-top:10px;height:34px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600}
#tracker{position:fixed;left:12px;bottom:12px;width:420px;height:226px;padding:14px 16px;z-index:10;display:flex;flex-direction:column}
.trh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.trh h3{font-size:14px}.trh .r{margin-left:auto}
.trsub{font-size:11.5px;color:var(--ink2);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steps{display:flex;position:relative;margin:0 4px}
.steps:before{content:"";position:absolute;left:14px;right:14px;top:13px;height:2px;background:var(--line)}
.steps .fill{position:absolute;left:14px;top:13px;height:2px;background:var(--accent);transition:width .6s}
.sp{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;z-index:1;text-align:center}
.sp .d{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--glass-solid);border:2px solid var(--line);color:var(--ink3)}
.sp.done .d{background:var(--accent);border-color:var(--accent);color:#fff}
.sp.cur .d{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.sp.bad .d{border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 5px var(--bad-soft)}
.sp b{font-size:11px;font-weight:600}.sp small{font-size:10.5px;color:var(--ink3);font-family:var(--mono)}
.trf{margin-top:auto;display:flex;gap:8px}.trf .st{flex:1;padding:7px 9px}.trf .st b{font-size:12.5px}
#table{position:fixed;left:444px;right:374px;bottom:12px;height:226px;z-index:10;display:flex;flex-direction:column;padding:10px 12px 8px}
.tabs{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.tab{padding:6px 11px;border-radius:8px;font-weight:600;font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center}
.tab em{font-style:normal;font-size:10.5px;background:var(--chip);border-radius:6px;padding:0 5px;color:var(--ink2)}
.tab.on{background:var(--accent);color:#fff}.tab.on em{background:rgba(255,255,255,.25);color:#fff}
.tabs .r{margin-left:auto;font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:6px}
#tbody{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:11.8px}
th{position:sticky;top:0;background:var(--glass-solid);text-align:left;font-weight:600;color:var(--ink3);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;z-index:1}
td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr.rw{cursor:pointer}tr.rw:hover td{background:var(--chip)}tr.sel td{background:var(--accent-soft)!important}
.dots{display:flex;gap:3px}.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}.dots i.f{background:var(--accent)}.dots i.x{background:var(--bad)}
.mini{padding:3px 9px;border-radius:7px;background:var(--accent);color:#fff;font-size:11px;font-weight:600}
.dim{color:var(--ink3)}.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.tag{position:absolute;left:0;top:0;padding:4px 9px;border-radius:8px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);font-size:11px;font-weight:600;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px}
.tag small{font-weight:500;color:var(--ink2)}
.tag.big{font-size:13px;padding:6px 12px}.tag.big i{width:8px;height:8px;border-radius:50%}
.tag.selt{background:var(--accent);color:#fff;border-color:transparent}.tag.selt small{color:rgba(255,255,255,.8)}
.tag.part{font-size:10px;padding:3px 7px;gap:5px;border-left:3px solid var(--c)}
.tag.part b{font-weight:700}
.flt{position:absolute;left:0;top:0;font-weight:700;font-size:12px;white-space:nowrap;padding:3px 8px;border-radius:7px;color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.flt.spend{background:#e5484d}.flt.rev{background:#16a34a}.flt.pay{background:#2F6BFF}.flt.gr{background:#7c5cff}
/* supplier hub modal */
#hub{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,22,30,.28);backdrop-filter:blur(3px)}
#hub.on{display:flex}
#hubBox{width:min(1180px,calc(100vw - 32px));height:min(820px,calc(100vh - 32px));display:flex;flex-direction:column;padding:20px 22px;border-radius:22px}
.hubh{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hubh h2{font-size:22px;letter-spacing:-.5px}.hubh p{color:var(--ink2);font-size:12.5px}
.hubh .x{margin-left:auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--chip)}
.hubf{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--chip);font-size:12px;font-weight:600;color:var(--ink2)}
.chip.on{background:var(--ink);color:var(--glass-solid);border-color:transparent}
.hubsum{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
#hubGrid{flex:1;min-height:0;overflow:auto;display:grid;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;align-content:start;padding-right:4px}
.sc{background:var(--glass-solid);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
.sc:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.sc:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.sct{display:flex;gap:10px;align-items:center}
.scl{width:38px;height:38px;border-radius:11px;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px;flex:none}
.sct b{display:block;font-size:13.5px}.sct span{font-size:11px;color:var(--ink2)}
.ring{margin-left:auto;position:relative;width:46px;height:46px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
.esg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.esg div{font-size:10.5px;color:var(--ink2)}.esg div b{color:var(--ink);font-size:12px;margin-left:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--ink2)}
.scm{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:10.5px;color:var(--ink2)}
.scm b{display:block;color:var(--ink);font-size:12.5px;font-variant-numeric:tabular-nums}
#mnav{display:none}
@media (max-width:1180px){#table{left:12px;right:374px;bottom:250px;height:200px}#detail{max-height:calc(100vh - 104px)}.kpi{width:180px}.hubsum{grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){
  #top{left:8px;right:8px;top:8px;height:auto;flex-wrap:wrap;padding:8px;gap:8px}
  .brand span,.clock span,.avatar,#areaBtn .lbl,#wxBtn .lbl,#hubBtn .lbl{display:none}
  .search{order:9;max-width:none;flex-basis:100%}
  #kpis{top:118px;left:8px;right:8px;overflow-x:auto;gap:8px;scrollbar-width:none}#kpis::-webkit-scrollbar{display:none}
  .kpi{min-width:160px;width:160px;padding:9px 11px}.kpi .v{font-size:18px}.kpi svg.sp{display:none}
  #detail,#tracker,#table{left:8px!important;right:8px!important;width:auto!important;top:auto!important;bottom:60px!important;height:44vh!important;max-height:none!important;display:none}
  #tracker.mshow,#table.mshow{display:flex;flex-direction:column}#detail.mshow{display:block}
  #mnav{display:flex;position:fixed;left:8px;right:8px;bottom:8px;height:46px;z-index:11;padding:4px;gap:4px}
  #mnav button{flex:1;border-radius:11px;font-weight:600;font-size:12px;color:var(--ink2)}#mnav button.on{background:var(--accent);color:#fff}
  .hubsum{grid-template-columns:repeat(2,1fr)}#hubBox{padding:14px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;z-index:50;font:600 14px Inter,sans-serif;color:#5b6270">Loading 3D models…</div>
<header id="top" class="glass">
  <div class="brand"><div class="logo">Z</div><div><b>Zeno</b><span>EV 1010 · Petrol 1020 · Source-to-Pay</span></div></div>
  <div class="search">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Search PO, supplier, part, VIN, zone…" autocomplete="off"><kbd>/</kbd>
    <div id="sres" class="glass"></div>
  </div>
  <div class="tb-sp"></div>
  <button class="btn pri" id="hubBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg><span class="lbl">Supplier Hub</span></button>
  <div class="dd">
    <button class="btn" id="areaBtn"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l5 3V9l5 3V5h4v16"/></svg><span class="lbl" id="areaLbl">Whole site</span><svg class="i" viewBox="0 0 24 24" style="width:12px"><path d="m6 9 6 6 6-6"/></svg></button>
    <div class="menu glass" id="areaMenu"></div>
  </div>
  <div class="dd">
    <button class="btn" id="wxBtn"><span id="wxIco">☀️</span><span class="lbl" id="wxLbl">21°C Clear</span></button>
    <div class="menu glass" id="wxMenu">
      <button data-w="clear">☀️ Clear <small>21°C</small></button><button data-w="rain">🌧️ Rain <small>14°C</small></button>
      <button data-w="fog">🌫️ Fog <small>9°C</small></button><button data-w="heat">🔥 Heatwave <small>36°C</small></button>
    </div>
  </div>
  <div class="seg" id="speed"><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button></div>
  <div class="clock"><b id="clock">14:20:00</b><span>Shift B · <i class="live">LIVE</i></span></div>
  <div class="dd">
    <button class="bell" id="bell"><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><em id="bellN">0</em></button>
    <div class="menu glass" id="alerts"></div>

const movers=[];
function addMover(m){m.v=0;m.i=0;m.arrived=false;m.pause=0;movers.push(m);return m;}
function removeMover(m){const i=movers.indexOf(m);if(i>=0)movers.splice(i,1);scene.remove(m.obj);unpick(m.obj);if(S.sel&&(S.sel.ref===m||(S.sel.ref&&S.sel.ref.mover===m)))select(null);}
function angLerp(a,b,t){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
function updateMovers(dt){
  for(const m of movers.slice()){
    if(m.dead)continue;const p=m.obj.position,pt=m.path[m.i];if(!pt)continue;
    if(m.arrived){
      if(pt.face!==undefined){m.obj.rotation.y=angLerp(m.obj.rotation.y,pt.face,Math.min(1,dt*3));if(Math.abs(angLerp(m.obj.rotation.y,pt.face,1)-m.obj.rotation.y)>.03)continue;}
      if(m.pause>0){m.pause-=dt;continue;}
      if(pt.hold&&pt.hold(m))continue;
      if(pt.leave)pt.leave(m);m.arrived=false;m.i++;if(m.i>=m.path.length){m.dead=true;m.onEnd&&m.onEnd(m);}continue;}
    const dx=pt.x-p.x,dz=pt.z-p.z,d=Math.hypot(dx,dz);
    if(d<.06){p.x=pt.x;p.z=pt.z;m.arrived=true;m.pause=pt.pause||0;if(pt.arrive)pt.arrive(m);continue;}
    const hx=dx/d,hz=dz/d;let blocked=false;
    for(const o of movers){if(o===m||o.dead||o.grp!==m.grp)continue;const ox=o.obj.position.x-p.x,oz=o.obj.position.z-p.z,od=Math.hypot(ox,oz);
      const gap=(m.len+o.len)/2+1.8;if(od<gap&&od>.001&&(ox*hx+oz*hz)/od>.6){blocked=true;break;}}
    if(blocked){m.bt=(m.bt||0)+dt;if(m.bt<4){m.v=Math.max(0,m.v-m.speed*dt*3);if(m.v<=0)continue;}}else m.bt=0;
    const target=(pt.slow&&d<10)?Math.max(m.speed*.35,d*.6):m.speed;
    if(m.v>target)m.v=Math.max(target,m.v-m.speed*dt*2);else m.v=Math.min(target,m.v+m.speed*dt*.9);
    const step=Math.min(d,m.v*dt);p.x+=hx*step;p.z+=hz*step;
    if(!pt.rev){m.obj.rotation.y=angLerp(m.obj.rotation.y,Math.atan2(-hz,hx),Math.min(1,dt*(m.turn||4)));}
    else{const want=Math.atan2(hz,-hx);m.obj.rotation.y=angLerp(m.obj.rotation.y,want,Math.min(1,dt*2));}
    if(m.wheels)m.wheels.forEach(w=>w.rotation.z-=step/.4*(pt.rev?-1:1));
  }
}

det.addEventListener('click',e=>{const t=e.target.closest('[data-close],[data-sup],[data-po],[data-stock],[data-resolve],[data-hub],[data-zone]');if(!t)return;
  if(t.dataset.close!==undefined)return select(null);if(t.dataset.hub!==undefined)return openHub();
  if(t.dataset.resolve){const po=POS.find(p=>p.no===t.dataset.resolve);if(po)resolve(po,'Buyer approved credit memo');renderDetail();return;}
  if(t.dataset.sup)return select({type:'supplier',ref:SUP[t.dataset.sup]});
  if(t.dataset.po){const po=POS.find(p=>p.no===t.dataset.po);if(po)select({type:po.truck?'truck':'po',ref:po.truck||po});return;}
  if(t.dataset.zone){const [pid,k]=t.dataset.zone.split('|');return select({type:'zone',ref:PL[pid].zones[k]});}

function renderTracker(){const po=S.trackPO||POS[0];if(!po){$('#tracker').innerHTML='';return;}
  const exc=po.status==='Exception',cur=exc?4:Math.min(po.step+1,5),done=po.step;
  $('#tracker').innerHTML=`<div class="trh"><h3>Source-to-Pay tracker</h3><span class="pill ${stPill(po)} r">${po.status}</span></div>
  <div class="trsub"><span class="mono" style="color:var(--ink)">PO ${po.no}</span>·<span>${po.sup.name}</span>·<span>${po.part.name}</span><span class="pill ${po.pl.id==='EV'?'p-ev':'p-ice'}">${po.pl.name}</span></div>
  <div class="steps"><div class="fill" style="width:calc((100% - 28px) * ${Math.min(done,5)/5})"></div>
  ${STEPS.map((s,i)=>{const cls=i<=done&&!(exc&&i===4)?'done':(exc&&i===4)?'bad':i===cur?'cur':'';
    return `<div class="sp ${cls}"><div class="d">${cls==='done'?ic('check','style="width:14px;height:14px"'):cls==='bad'?'!':i+1}</div><b>${s}</b><small>${i===0?po.sup.contract.slice(-4):po.t[i]||'—:—'}</small></div>`;}).join('')}</div>
  <div class="trf">${stat('Value',eur(po.value))}${stat('Qty',po.qty)}${stat('Mode',po.mode)}${stat('Match',po.inv?(exc?'<span style="color:var(--bad)">Exception</span>':'3-way ✓'):'Pending')}</div>`;}

  const avg=Math.round(all.reduce((a,s)=>a+s.esgT,0)/all.length),tot=all.reduce((a,s)=>a+s.spend,0);
  const grid=L.map(s=>{const ps=PARTS.filter(p=>p.sup===s.id);const init=s.name.split(' ').map(w=>w[0]).join('').slice(0,2);

    <span style="margin-left:auto;font-size:12px;color:var(--ink2)">Sort</span>${[['esg','ESG'],['spend','Spend'],['otd','On-time'],['name','Name']].map(([k,n])=>`<button class="chip ${S.hubSort===k?'on':''}" data-s="${k}">${n}</button>`).join('')}</div>
  <div id="hubGrid">${grid}</div>`;
}

// ================================================================= WEATHER / DAY-NIGHT / RENDER
const WX={clear:{ico:'☀️',l:'21°C Clear',fogN:600,fogF:1500,tint:0xE9E3D7,sun:1.9,sunC:0xffeed2},rain:{ico:'🌧️',l:'14°C Rain',fogN:160,fogF:700,tint:0xc5c9ce,sun:.8,sunC:0xdfe6ef},
  fog:{ico:'🌫️',l:'9°C Fog',fogN:50,fogF:380,tint:0xdedfdc,sun:.9,sunC:0xf0f0f0},heat:{ico:'🔥',l:'36°C Heatwave',fogN:260,fogF:900,tint:0xF0DCC0,sun:2.3,sunC:0xffd29a}};
function setWeather(w){S.weather=w;$('#wxIco').textContent=WX[w].ico;$('#wxLbl').textContent=WX[w].l;rain.visible=w==='rain';document.querySelectorAll('#wxMenu button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));}
setWeather('clear');
const tmpC=new THREE.Color(),tmpC2=new THREE.Color(),moon=lin(0x8fa6d8);
function updateEnv(dt){
  S.night+=(S.nightT-S.night)*Math.min(1,dt*1.8);const n=S.night,Wx=WX[S.weather];
  tmpC.copy(lin(Wx.tint)).lerp(NIGHT_BG,n);scene.background.lerp(tmpC,Math.min(1,dt*3));scene.fog.color.copy(scene.background);
  scene.fog.near+=(Wx.fogN-scene.fog.near)*Math.min(1,dt*2);scene.fog.far+=(Wx.fogF*(1-n*.2)-scene.fog.far)*Math.min(1,dt*2);
  sun.intensity=Wx.sun*(1-n)+.25*n;tmpC2.copy(lin(Wx.sunC)).lerp(moon,n);sun.color.copy(tmpC2);hemi.intensity=HEMI_BASE*(1-n)+.12*n;
  glowMats.forEach(m=>m.emissiveIntensity=(m.userData.base||0)+n*2.2);nightLights.forEach(l=>l.intensity=n*2.4);
  if(bloom){bloom.enabled=n>.05;bloom.strength=n*.9;bloom.threshold=1.2;}
  if(rain.visible){const a=rGeo.attributes.position.array;for(let i=0;i<RN;i++){a[i*3+1]-=dt*80;if(a[i*3+1]<0)a[i*3+1]=120;}rGeo.attributes.position.needsUpdate=true;rain.position.set(controls.target.x,0,controls.target.z);}
  const dist=camera.position.distanceTo(controls.target);
  const op=clamp((dist-230)/120,0,1);roofMats.forEach(m=>{m.opacity=op;m.depthWrite=op>.95;});PLANTS.forEach(pl=>pl.roof.visible=op>.02);
  PLANTS.forEach(pl=>{const b=pl.barrier;b.open+=(b.want-b.open)*Math.min(1,dt*4);b.pv.rotation.z=b.open*1.35*pl.dir;});
  // sun & shadow follow the camera target
  const sz=clamp(dist*.62,45,340);const sc=sun.shadow.camera;if(Math.abs(sc.right-sz)>1){sc.left=-sz;sc.right=sz;sc.top=sz;sc.bottom=-sz;sc.updateProjectionMatrix();}
  sun.target.position.copy(controls.target);sun.position.copy(controls.target).addScaledVector(SUN_OFF,450);
  if(tiltH){const amt=clamp((dist-60)/400,0,1)*2.2;tiltH.uniforms.h.value=amt/innerWidth;tiltV.uniforms.v.value=amt/innerHeight;tiltV.uniforms.r.value=.5;tiltH.uniforms.r&&(tiltH.uniforms.r.value=.5);}
}
const clk={last:performance.now(),dt:0};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(composer){composer.setSize(innerWidth,innerHeight);composer.setPixelRatio&&composer.setPixelRatio(PR);}}
addEventListener('resize',resize);resize();
let histT=0;
function frame(now){
  requestAnimationFrame(frame);
  const rdt=Math.min(.05,(now-clk.last)/1000);clk.last=now;clk.dt=rdt;const dt=rdt*S.speed;T+=dt;S.sim+=dt*10;
  const P_=window.__prof||(window.__prof={});let t_=performance.now();const pm=k=>{const n=performance.now();P_[k]=(P_[k]||0)*.9+(n-t_)*.1;t_=n;};
  runTasks(dt);pm('tasks');PLANTS.forEach(pl=>updateLine(pl,dt));pm('line');updateMovers(dt);pm('movers');updateTrain(dt);updatePallets(dt);updateForks(dt);pm('log');animateZones(dt);pm('zones');
  updateSparks(dt);updateCoins(dt);updateGliding(dt);updatePeople(dt);pm('fx');updateEnv(rdt);pm('env');
  histT+=dt;if(histT>20){histT=0;S.hist1.push(28+Math.round(rand(-3,5)));S.hist1.shift();S.hist2.push(600+rand(-50,80));S.hist2.shift();S.hist3.push(S.marginSum/S.marginN);S.hist3.shift();}
  if(fly){fly.t+=rdt/1.2;const k=ease(clamp(fly.t,0,1));const gt=fly.getT();const dir=fly.dir||fly.fromP.clone().sub(fly.fromT).normalize();
    const gp=gt.clone().addScaledVector(dir,fly.dist);controls.target.lerpVectors(fly.fromT,gt,k);camera.position.lerpVectors(fly.fromP,gp,k);if(fly.t>=1)fly=null;}
  else if(S.sel&&['car','truck','fork','train'].includes(S.sel.type)){const p=worldPosOf(S.sel);if(p){if(lastFollow){const d=p.clone().sub(lastFollow);camera.position.add(d);controls.target.add(d);}lastFollow=p;}}
  if(S.sel&&ring.visible){const p=worldPosOf(S.sel);if(p){ring.position.set(p.x,.25,p.z);ring.material.opacity=.55+.35*Math.sin(now/220);}}
  pm('cam');controls.update();$('#clock').textContent=fmtTs(S.sim);updateLabels();pm('labels');refreshUI(false);pm('ui');
  if(composer)composer.render(rdt);else renderer.render(scene,camera);pm('render');
}
renderDetail();refreshUI(true);requestAnimationFrame(frame);
window.__zeno={S,POS,PLANTS,select,movers,openHub,renderer,scene,camera,composer,controls,
  tick:(n,dt=.05)=>{for(let i=0;i<n;i++){T+=dt;S.sim+=dt*10;runTasks(dt);PLANTS.forEach(pl=>updateLine(pl,dt));updateMovers(dt);updateTrain(dt);updatePallets(dt);updateForks(dt);animateZones(dt);updateGliding(dt);}},
  state:()=>({trucks:movers.filter(m=>m.kind==='truck'&&!m.dead).map(m=>[m.po.sup.name,m.po.status,Math.round(m.obj.position.x),Math.round(m.obj.position.z)]),
    forks:PLANTS.flatMap(p=>p.forks.map(f=>f.id+':'+f.state)),queues:PLANTS.flatMap(p=>p.bays.map(b=>b.queue.length)).concat([railBay.queue.length]),
    train:train?train.state:null,cars:movers.filter(m=>m.kind==='car'&&!m.dead).map(m=>m.unit.state),built:{...S.built}})};

<script>
// load the packed GLB cars (assets/cars.js), then start the app
(function(){
  const run=()=>{const b=document.getElementById('boot');if(b)b.remove();window.__zenoMain();};
  const C=window.ZENO_CARS;if(!C||!THREE.GLTFLoader){run();return;}
  const L=new THREE.GLTFLoader(),jobs=[];window.ZENO_GLTF={};
  for(const [car,lods] of Object.entries(C))for(const [lod,b64] of Object.entries(lods))jobs.push(new Promise(res=>{
    try{const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer;
      L.parse(bin,'',g=>{(window.ZENO_GLTF[car]=window.ZENO_GLTF[car]||{})[lod]=g.scene;res();},e=>{console.warn('car model failed',car,lod,e);res();});}
    catch(e){console.warn('car model failed',car,lod,e);res();}}));
  Promise.all(jobs).then(run);
})();
</script>
